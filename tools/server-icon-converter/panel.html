<div class="tool-panel" data-tool="icon">
      <label class="field-label" for="icon-file">Upload image</label><input id="icon-file" class="file-input" type="file" accept="image/png,image/jpeg,image/webp">
      <button class="button primary generate-button" id="generate-icon" type="button">Generate Icon Preview</button>
      <div class="preview-card"><span class="preview-title">Icon preview</span><canvas id="icon-canvas" width="64" height="64" class="icon-canvas" aria-label="Server icon preview"></canvas></div>
      <button class="button primary" id="download-icon" type="button">Download server-icon.png</button>
      <p class="muted-note">The downloaded file is resized to 64x64 PNG. Put it in your server root folder and restart the server.</p>
    </div>
