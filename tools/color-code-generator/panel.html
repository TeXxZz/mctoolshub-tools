<div class="tool-panel" data-tool="colors">
      <div class="two-col">
        <div><label class="field-label" for="color-text">Preview text</label><input id="color-text" class="tool-input single" value="Welcome to MCToolsHub"></div>
        <div><label class="field-label" for="color-picker">Pick a color</label><input id="color-picker" class="color-picker" type="color" value="#55ff55"></div>
      </div>
      <button class="button primary generate-button" data-generate type="button">Generate Color Output</button>
      <div class="preview-card"><span class="preview-title">Preview</span><div id="color-preview" class="big-preview">Welcome to MCToolsHub</div></div>
      <div class="output-grid">
        <label>Hex<input id="hex-output" class="tool-output single" readonly></label>
        <label>MiniMessage<input id="mini-output" class="tool-output single" readonly></label>
        <label>Legacy hex<input id="legacy-hex-output" class="tool-output single" readonly></label>
      </div>
      <h2 class="small-heading">Legacy Minecraft color codes</h2>
      <div class="legacy-table" id="legacy-colors"></div>
    </div>
