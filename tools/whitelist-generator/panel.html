<div class="tool-panel" data-tool="whitelist">
      <label class="field-label" for="whitelist-names">Player names, one per line</label><textarea id="whitelist-names" class="tool-input" rows="6">Steve
Alex</textarea>
      <label>Action<select id="whitelist-action" class="tool-input single"><option value="add">Add players</option><option value="remove">Remove players</option><option value="on">Enable whitelist</option><option value="off">Disable whitelist</option><option value="reload">Reload whitelist</option></select></label>
      <button class="button primary generate-button" data-generate type="button">Generate Whitelist Commands</button>
      <label class="field-label" for="whitelist-output">Generated commands</label><textarea id="whitelist-output" class="tool-output" rows="8" readonly></textarea><button class="button primary copy-button" data-copy-target="whitelist-output">Copy commands</button>
    </div>
